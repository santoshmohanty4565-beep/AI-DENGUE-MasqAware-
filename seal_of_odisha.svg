<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="56" height="56" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <style>
    .seal-stroke { fill: none; stroke: #1e293b; stroke-linecap: round; stroke-linejoin: round; }
    .seal-fill { fill: #1e293b; }
  </style>

  <!-- Outer Double Seal Circles (Transparent Background) -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#1e293b" stroke-width="10" />
  <circle cx="250" cy="250" r="218" class="seal-stroke" stroke-width="5" />
  <circle cx="250" cy="250" r="145" class="seal-stroke" stroke-width="5" />

  <!-- Left & Right Concentric Circle Dots -->
  <g transform="translate(48, 250)">
    <circle cx="0" cy="0" r="14" class="seal-stroke" stroke-width="4" />
    <circle cx="0" cy="0" r="5" class="seal-fill" />
  </g>
  <g transform="translate(452, 250)">
    <circle cx="0" cy="0" r="14" class="seal-stroke" stroke-width="4" />
    <circle cx="0" cy="0" r="5" class="seal-fill" />
  </g>

  <!-- Top Arc Text (Odia): ଓଡ଼ିଶା ଶାସନ -->
  <path id="top-arc-path" d="M 75 250 A 175 175 0 0 1 425 250" fill="none" />
  <text font-family="'Noto Sans Oriya', 'Times New Roman', serif" font-size="44" font-weight="900" class="seal-fill" letter-spacing="6">
    <textPath href="#top-arc-path" startOffset="50%" text-anchor="middle">ଓଡ଼ିଶା ଶାସନ</textPath>
  </text>

  <!-- Bottom Arc Text (Devanagari): ओड़िशा शासन -->
  <path id="bottom-arc-path" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />
  <text font-family="'Noto Sans Devanagari', 'Times New Roman', serif" font-size="42" font-weight="900" class="seal-fill" letter-spacing="4">
    <textPath href="#bottom-arc-path" startOffset="50%" text-anchor="middle">ओड़िशा शासन</textPath>
  </text>

  <!-- Top Crest: Lion Capital of Ashoka (Official Emblem of India) -->
  <g transform="translate(250, 135) scale(1.1)" text-anchor="middle">
    <!-- Ashoka Lions Group -->
    <path d="M-18 -52 C-24 -72 0 -84 18 -52 C26 -35 12 -20 0 -20 C-12 -20 -26 -35 -18 -52 Z" class="seal-fill" />
    <circle cx="0" cy="-62" r="7" fill="none" stroke="#1e293b" stroke-width="2" />
    <!-- Left Lion Head -->
    <path d="M-38 -42 C-55 -60 -30 -72 -18 -48 Z" class="seal-fill" />
    <!-- Right Lion Head -->
    <path d="M38 -42 C55 -60 30 -72 18 -48 Z" class="seal-fill" />

    <!-- Base Abacus Platform -->
    <rect x="-44" y="-20" width="88" height="22" rx="4" class="seal-fill" />
    <circle cx="0" cy="-9" r="7.5" fill="none" stroke="#1e293b" stroke-width="2.5" />
    <circle cx="-25" cy="-9" r="4" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="25" cy="-9" r="4" fill="none" stroke="#1e293b" stroke-width="2" />

    <!-- Satyameva Jayate Inscription below Base -->
    <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" class="seal-fill" letter-spacing="1">सत्यमेव जयते</text>
  </g>

  <!-- Center Emblem: Konark Rearing Warrior Horse Statue with Warrior -->
  <g transform="translate(244, 282) scale(1.4)">
    <!-- Base Platform Line -->
    <line x1="-70" y1="52" x2="70" y2="52" stroke="#1e293b" stroke-width="5.5" stroke-linecap="round" />

    <!-- Konark Warrior Horse Silhouette -->
    <!-- Head & Ears -->
    <path d="M-52 -12 C-42 -42 -22 -46 -10 -30 C-6 -12 -18 0 -25 10 Z" class="seal-fill" />
    <path d="M-26 -46 L-30 -58 L-22 -50 Z" class="seal-fill" />
    <!-- Neck & Powerful Chest -->
    <path d="M-20 -10 C-5 -22 18 -16 28 2 C38 -20 28 -38 20 -20 L12 -30 C8 -15 0 -5 Z" class="seal-fill" />
    <!-- Raised Rearing Front Legs -->
    <path d="M15 -28 C30 -44 38 -24 30 -16 L22 -10 Z" class="seal-fill" />
    <!-- Hind Legs & Thighs -->
    <path d="M-40 8 C-52 20 -40 45 -34 50 L-22 50 C-30 38 -34 20 -24 14 Z" class="seal-fill" />
    <path d="M-18 14 C-24 26 -18 45 -12 50 L-2 50 C-8 38 -12 26 -6 14 Z" class="seal-fill" />
    <!-- Tail -->
    <path d="M-48 -5 Q-65 14 -56 38 L-48 25 Z" class="seal-fill" />

    <!-- Fallen Warrior / Attendant Figure under Horse -->
    <path d="M12 30 C28 18 45 32 42 48 L8 48 C4 36 12 30 Z" class="seal-fill" />
    <circle cx="48" cy="26" r="7.5" class="seal-fill" />

    <!-- Saddle & Harness Cutouts -->
    <path d="M-25 -10 Q-15 -15 -6 2 Q-15 15 -25 -10 Z" fill="none" stroke="#1e293b" stroke-width="2.5" />
  </g>
</svg>